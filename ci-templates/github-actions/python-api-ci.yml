name: Python API CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint
        run: |
          if command -v ruff >/dev/null 2>&1; then ruff check .; else echo 'ruff not installed, skipping'; fi

      - name: Typecheck
        run: |
          if command -v pyright >/dev/null 2>&1; then pyright .; else echo 'pyright not installed, skipping'; fi

      - name: Test
        run: |
          if command -v pytest >/dev/null 2>&1; then pytest; else echo 'pytest not installed, skipping'; fi
